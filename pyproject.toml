[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pumpquant"
version = "0.1.0"
description = "Backtesting engine for Pump.fun, Solana's token-launch market"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Elias Hassari" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "certifi>=2024.8",
]

[project.urls]
Repository = "https://github.com/Kobflish1/pumpquant"
Documentation = "https://github.com/Kobflish1/pumpquant/tree/main/docs"

[project.optional-dependencies]
data = [
  "duckdb>=1.1",
  "pyarrow>=18",
]
research = [
  "arch>=8,<9",
  "numpy>=2,<3",
]
bigquery = [
  "google-cloud-bigquery>=3.42,<4",
  "google-cloud-bigquery-storage>=2.27,<3",
]
archive = [
  "pumpquant[data]",
  "google-cloud-bigquery-storage>=2.27,<3",
  "boto3>=1.35",
  "zstandard>=0.23",
]
dev = [
  "pumpquant[data,research,archive]",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
pumpquant = "pumpquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pumpquant"]

[tool.pytest.ini_options]
addopts = ["-q", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Keep TypeAlias and TypeVar spellings: PEP 695 aliases are lazy runtime objects, and the
# rewrite is not behaviour-preserving everywhere these names are used.
ignore = ["UP040", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pumpquant"]

# Optional SDKs are untyped or absent depending on the installed extras; treat them
# as Any so type checking gives the same answer in every environment.
[[tool.mypy.overrides]]
module = [
  "boto3",
  "google.*",
  "pyarrow",
  "pyarrow.*",
  "zstandard",
]
ignore_missing_imports = true
follow_imports = "skip"
