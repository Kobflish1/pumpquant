[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pumpquant"
version = "0.1.0"
description = "Execution-aware research and strategy discovery for Pump.fun token markets"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Elias Hassari" }]
dependencies = [
  "certifi>=2024.8",
]

[project.optional-dependencies]
data = [
  "duckdb>=1.1",
  "polars>=1.12",
  "pyarrow>=18",
]
research = [
  "arch>=8,<9",
  "numpy>=2,<3",
]
bigquery = [
  "google-cloud-bigquery>=3.42,<4",
  "google-cloud-bigquery-storage>=2.27,<3",
]
archive = [
  "pyarrow>=18",
  "google-cloud-bigquery-storage>=2.27,<3",
  "boto3>=1.35",
  "orjson>=3.10",
  "zstandard>=0.23",
]
stream = [
  "websockets>=16.1,<17",
]
dev = [
  "arch>=8,<9",
  "hypothesis>=6.100",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
pumpquant = "pumpquant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pumpquant"]

[tool.pytest.ini_options]
addopts = ["-q", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pumpquant"]

# Optional SDKs are untyped or absent depending on the installed extras; treat them
# as Any so type checking gives the same answer in every environment.
[[tool.mypy.overrides]]
module = [
  "boto3",
  "google.*",
  "pyarrow",
  "pyarrow.*",
  "zstandard",
]
ignore_missing_imports = true
follow_imports = "skip"

# The correction-v2 runner scripts are private and not part of this snapshot.
[[tool.mypy.overrides]]
module = ["scripts", "scripts.*"]
ignore_missing_imports = true
