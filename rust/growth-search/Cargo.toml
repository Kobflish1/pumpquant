[package]
name = "growth-search"
version = "0.1.0"
edition = "2024"
description = "Parallel searches over labelled research data, ranking rules by geometric growth"
license = "MIT"
publish = false

[dependencies]
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

