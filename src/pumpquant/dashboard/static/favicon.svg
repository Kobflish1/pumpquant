<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PumpQuant: two clocks (when an event happened, when it could be seen)
       and the decision boundary between them, drawn as layered Liquid Glass. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#46c8ff"/><stop offset=".48" stop-color="#0a7cff"/><stop offset="1" stop-color="#3a2fd0"/>
    </linearGradient>
    <radialGradient id="bgLight" cx=".3" cy=".08" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- frosted glass body: brighter where light enters at the top -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".52"/><stop offset=".45" stop-color="#fff" stop-opacity=".3"/><stop offset=".8" stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity=".34"/>
    </linearGradient>
    <!-- specular rim: bright on the upper-left edge, catching again lower-right -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#fff" stop-opacity=".15"/><stop offset=".7" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#eef6ff"/><stop offset="1" stop-color="#d7e9ff"/>
    </linearGradient>
    <linearGradient id="tileRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".3" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- background layer -->
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#bgLight)"/>

    <!-- shadows the glass casts on the background -->
    <g fill="#0b1a6b" opacity=".35" filter="url(#soft)">
      <circle cx="25.5" cy="35" r="14.5"/><circle cx="39.5" cy="35" r="14.5"/>
    </g>

    <!-- two glass clocks; their overlap reads brighter, like stacked glass -->
    <circle cx="25" cy="32" r="14.5" fill="url(#glass)"/>
    <circle cx="39" cy="32" r="14.5" fill="url(#glass)"/>
    <circle cx="25" cy="32" r="14" fill="none" stroke="url(#rim)" stroke-width="1"/>
    <circle cx="39" cy="32" r="14" fill="none" stroke="url(#rim)" stroke-width="1"/>

    <!-- the decision boundary: one solid, lit bar in front -->
    <rect x="30.2" y="11.5" width="4" height="44" rx="2" fill="#0b1a6b" opacity=".3" filter="url(#soft)"/>
    <rect x="30" y="9.5" width="4" height="44" rx="2" fill="url(#bar)"/>
    <rect x="30.6" y="10.5" width="1.2" height="14" rx=".6" fill="#fff"/>

    <!-- lit edge around the whole tile -->
    <rect x=".35" y=".35" width="63.3" height="63.3" rx="14.65" fill="none" stroke="url(#tileRim)" stroke-width=".7"/>
  </g>
</svg>
